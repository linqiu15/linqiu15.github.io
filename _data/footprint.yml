# =============================================================
# Footprint — trips rendered on /footprint/
# -------------------------------------------------------------
# Structure:
#   - year: e.g. "2025"
#     year_note: subtitle shown next to the year (Chinese ok)
#     trips:
#       - eyebrow: small uppercase label, e.g. "Feb · Yunnan"
#         title_cn: Chinese name
#         title_en: English name (optional)
#         images: list of filenames under /images/footprint/
# -------------------------------------------------------------
# To add a trip: drop photos into /images/footprint/, then add
# a new block here. Images render in the order listed.
# =============================================================

